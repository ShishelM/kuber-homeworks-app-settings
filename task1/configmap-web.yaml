apiVersion: v1
kind: ConfigMap
metadata:
  name: nginx-config
  namespace: default
data:
  default.conf: |
    server {
        listen 80;
        server_name localhost;
        location / {
            root /usr/share/nginx/html;
            index index.html;
        }
    }
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: web-content
  namespace: default
data:
  index.html: |
    <!DOCTYPE html>
    <html>
    <head>
        <title>Страница из ConfigMap</title>
    </head>
    <body>
        <h1>Привет от Kubernetes, братишка!</h1>
        <p>Конфигурация через ConfigMap успешно подтянулась.</p>
    </body>
    </html>
